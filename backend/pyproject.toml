[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bowling-stats"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.48",
    "alembic>=1.20",
    "pillow>=13",
    "pillow-heif>=1.8",
    "anthropic>=1.15",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # autogenerated

[tool.mypy]
python_version = "3.12"
strict = true
